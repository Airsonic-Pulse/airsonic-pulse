name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build:
        runs-on: [self-hosted, linux, x64, repo-airsonic-pulse]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v5
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

            - name: Verify ffmpeg
              run: ffmpeg -version

            - name: Create music directory
              run: mkdir -p /tmp/music

            - name: Build and test
              run: mvn clean verify
