name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

            - name: Install ffmpeg
              run: sudo apt-get install -y ffmpeg

            - name: Create music directory
              run: mkdir -p /tmp/music

            - name: Build and test
              run: mvn clean verify
