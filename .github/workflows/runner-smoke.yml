name: runner-smoke

on:
  workflow_dispatch:

permissions: read-all

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, repo-airsonic-pulse]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Show runtime
        run: |
          id
          hostname
          uname -a
          pwd
          ls -la
