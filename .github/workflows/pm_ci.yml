name: "CI - Push to Main"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "*.txt"
      - "docs/**"
      - "contrib/**"
      - ".github/**"
      - "!.github/workflows/pm_ci.yml"

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64, repo-airsonic-pulse]
    steps:
      - uses: actions/checkout@v5
      - name: Verify environment
        run: |
          java -version
          mvn --version
          ffmpeg -version
      - name: Create music directory
        run: mkdir -p /tmp/music
      - name: Build and test
        run: mvn clean verify
