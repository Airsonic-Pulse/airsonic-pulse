name: "CodeQL Advanced"

on:
  push:
    branches: [ 'main' ]
    paths-ignore: [ "**.md", "*.txt", ".github/**" ]
  pull_request:
    branches: [ 'main' ]
    paths-ignore: [ "**.md", "*.txt", ".github/**" ]
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest           # changed from self-hosted
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js (required for javascript-typescript extractor)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v5    # bumped from @v4 — runs on node24, clears deprecation warning
        with:
          node-version: '24'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"