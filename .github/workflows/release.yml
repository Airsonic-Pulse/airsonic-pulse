name: Release

run-name: Release ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write  # OIDC token for keyless cosign signing

jobs:
  build-and-release:
    runs-on: [self-hosted, linux, x64, repo-airsonic-pulse]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify environment
        run: |
          java -version
          mvn --version
          ffmpeg -version

      - name: Locate release notes
        id: notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/release-notes/${REF_NAME}.md"
          if [[ ! -f "${NOTES_FILE}" ]]; then
            echo "::error::Release notes file missing at ${NOTES_FILE}"
            echo "::error::Generate it locally with:"
            echo "::error::  bash .github/scripts/release-notes.sh ${REF_NAME}"
            echo "::error::Edit the file to add Highlights / Upgrade notes above the marker,"
            echo "::error::then commit, push, and re-tag."
            exit 1
          fi
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create music directory
        run: mkdir -p /tmp/music

      - name: Build and test
        run: mvn clean verify

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd airsonic-main/target
          sha256sum airsonic.war > artifacts-checksums.sha256

      - name: Determine prerelease flag
        id: prerelease
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag contains a hyphen → prerelease (e.g. v13.1.0-rc.1, v13.1.0-beta.2)
          if [[ "${REF_NAME}" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          PRERELEASE_FLAG: ${{ steps.prerelease.outputs.flag }}
        run: |
          gh release create "${REF_NAME}" \
            --title "${REF_NAME}" \
            --notes-file "${NOTES_FILE}" \
            ${PRERELEASE_FLAG} \
            airsonic-main/target/airsonic.war#airsonic.war \
            airsonic-main/target/artifacts-checksums.sha256#artifacts-checksums.sha256

      - name: Prepare Docker build context
        run: |
          mkdir -p install/docker/target/dependency
          cp airsonic-main/target/airsonic.war install/docker/target/dependency/airsonic-main.war

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker-tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAGS="ghcr.io/airsonic-pulse/airsonic-pulse:${VERSION}"
          # Add 'latest' tag only for non-prerelease versions (no hyphen in version)
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS},ghcr.io/airsonic-pulse/airsonic-pulse:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: install/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image with Cosign (keyless, via GitHub OIDC)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/airsonic-pulse/airsonic-pulse@${DIGEST}"