name: Bug Report
description: Report a bug in Airsonic-Pulse
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What Happened?
      description: Describe the actual behavior you observed.
      placeholder: Tell us what you see.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: |
        Describe how somebody else could observe the same behavior.
        If possible, include relevant configuration or files that cause the problem.
        If sharing media files, ensure you are legally permitted to share copies.
      placeholder: |
        1. Go to...
        2. Click on...
        3. Observe...
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of Airsonic-Pulse are you running?
      options:
        - 12.0.0 (initial release)
        - 13.0.0 (Alpha)
        - 13.0.0 (Beta)
        - 13.0.0 (RC)
        - 13.0.0 (Stable)
        - 14.0.0 (Alpha)
        - 14.0.0 (Beta)
        - 14.0.0 (RC)
    validations:
      required: true

  - type: input
    id: version-detail
    attributes:
      label: Version Detail
      description: If you selected an Alpha version, enter the full snapshot version here.
      placeholder: "e.g. 13.x.x-SNAPSHOT.xxxxxxxxxxxxx"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: |
        The operating system running Airsonic-Pulse.
        For Linux, include the distribution; for Windows or macOS, include the version.
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: The Java version used to run Airsonic-Pulse.
    validations:
      required: true

  - type: dropdown
    id: db
    attributes:
      label: Database
      description: Which database are you using?
      options:
        - HSQLDB (built-in database)
        - PostgreSQL 13.x
        - PostgreSQL 14.x
        - PostgreSQL 15.x
        - MySQL 8.x
        - MariaDB 10.x
        - MariaDB 11.x
        - Other
      multiple: true
    validations:
      required: true

  - type: input
    id: db-detail
    attributes:
      label: Database Detail
      description: If you selected Other, provide your database name and version.

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Paste your configuration parameters here. **Do not include passwords, secrets, or API keys.**
      placeholder: |
        spring.datasource.url=...
        server.port=4040
        airsonic.home=/var/airsonic
    validations:
      required: true

  - type: input
    id: proxy-server
    attributes:
      label: Proxy Server
      description: If running Airsonic-Pulse behind a reverse proxy, which server and version? Otherwise, leave blank.
    validations:
      required: false

  - type: input
    id: client
    attributes:
      label: Client
      description: Which browser or Subsonic-compatible application are you seeing the problem with?

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Which language / locale is configured in Airsonic-Pulse?
      options:
        - "English"
        - "English (United Kingdom)"
        - "English (United States)"
        - "French"
        - "Dutch"
        - "Spanish"
        - "Catalan"
        - "Portuguese"
        - "German"
        - "Italian"
        - "Greek"
        - "Russian"
        - "Slovenian"
        - "Macedonian"
        - "Polish"
        - "Bulgarian"
        - "Czech"
        - "Simplified Chinese"
        - "Traditional Chinese"
        - "Japanese"
        - "Korean"
        - "Norwegian (bokmål)"
        - "Norwegian (nynorsk)"
        - "Swedish"
        - "Danish"
        - "Finnish"
        - "Icelandic"
        - "Estonian"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant log output here. This will be automatically formatted as code.
      render: console
